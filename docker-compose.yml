services:
  omicloupe:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3838:3838"
    environment:
      - SHINY_LOG_LEVEL=TRACE
      - DISABLE_AUTH=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3838/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
