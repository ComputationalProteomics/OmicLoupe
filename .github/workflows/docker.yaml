name: Create and publish a Docker image to ghcr.io

on:
  push:
    branches:
      - main
      - master
      - improvements
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@ad44023a93711e3deb337508980b4b5e9bcdc5dc
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: local/test:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -euo pipefail

          container_id="$(docker run -d --rm -p 3838:3838 local/test:ci)"
          trap 'docker stop "${container_id}" >/dev/null 2>&1 || true' EXIT

          for i in {1..30}; do
            if curl -fsS "http://127.0.0.1:3838/" >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          docker logs "${container_id}" || true
          echo "OmicLoupe container did not become ready in time" >&2
          exit 1

      - name: Log in to the Container registry
        uses: docker/login-action@f054a8b539a109f9f41c372932f1ae047eff08c9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: image-tags
        run: |
          set -euo pipefail

          ref="${GITHUB_REF_NAME}"
          ref="${ref//\//-}"

          tags=()
          tags+=("${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}")

          if [ "${ref}" = "main" ] || [ "${ref}" = "master" ]; then
            tags+=("${REGISTRY}/${IMAGE_NAME}:latest")
          else
            tags+=("${REGISTRY}/${IMAGE_NAME}:${ref}")
          fi

          {
            echo 'tags<<EOF'
            printf '%s\n' "${tags[@]}"
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push Docker image
        uses: docker/build-push-action@ad44023a93711e3deb337508980b4b5e9bcdc5dc
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image-tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
